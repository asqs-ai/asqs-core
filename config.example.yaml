# asqs-core example configuration (schema v2). Copy to config.yaml and edit.
#
# Only the keys below are needed for a single `asqs-core run`. The full surface is larger; every key
# is documented on its own field in internal/config/schema_v2.go rather than here, because an
# exhaustive template stops being a starting point.
#
# Two rules make this file predictable:
#   * every toggle is positive — `enabled: false`, never `disable_something: true`;
#   * unknown keys FAIL the load and name their own path, so a typo cannot be silently ignored.
#
# Every key also has an environment variable, derived from its path: ASQS_ plus the dotted path
# upper-cased, with a leading `general.` dropped. general.database.metadata_url is
# ASQS_DATABASE_METADATA_URL; generation.policy.tools.max_turns is
# ASQS_GENERATION_POLICY_TOOLS_MAX_TURNS.
schema_version: 2

general:
  database:
    # PostgreSQL + pgvector (see `docker compose up -d`).
    metadata_url: "postgres://asqs:asqs@localhost:5432/asqs?sslmode=disable"
    embeddings_url: "" # empty = reuse metadata_url

  llm:
    # One provider drives every step; each step may override it in its own section.
    provider: openai # openai | anthropic | azure_openai | ollama
    model: "gpt-4o"
    # Provide the key directly, OR name an environment variable in api_key_from_env, which wins when
    # both are set. There is no ${VAR} interpolation: a literal "${MY_KEY}" is sent verbatim.
    api_key: "" # e.g. "sk-..."
    api_key_from_env: "" # e.g. OPENAI_API_KEY
    base_url: "" # e.g. http://127.0.0.1:11434 for a local Ollama (no key needed)
    # Ollama only; other providers ignore both. keep_alive -1 keeps the model loaded between calls
    # instead of reloading it after the server's 5-minute idle default; think false stops a reasoning
    # model from spending its output budget on a chain of thought before the answer.
    ollama_keep_alive: -1
    ollama_think: false
    embeddings:
      model: "text-embedding-3-small"
      dimension: 1536 # must match the model's output width

  build:
    # Empty detects from the repository. Set these only when detection is wrong.
    toolchain: "" # java-maven | java-gradle | typescript | csharp
    build_tool: "" # mvn | gradle
    format_command: "" # e.g. "prettier --write ." — empty means C# gets `dotnet format`, others none

  sandbox:
    type: local # local | docker
    timeout: "15m"
    images:
      # Empty uses the built-in image for each toolchain.
      java_maven: "" # default: maven:3.9-eclipse-temurin-21
      java_gradle: "" # default: gradle:8.11-jdk21
      node: "" # default: node:20-bookworm
      dotnet: "mcr.microsoft.com/dotnet/sdk:10.0"
    caches:
      # Compile and test run OFFLINE by default for reproducibility, so dependencies must already be
      # cached. If a docker build cannot fetch dependencies, either mount the host cache here, or set
      # sandbox.docker.offline_test: false to download live, or use sandbox.type: local.
      maven: "" # host ~/.m2 → /root/.m2 in the container
      gradle: "" # host ~/.gradle
      npm: "" # host ~/.npm
      nuget: "" # host ~/.nuget/packages
    docker:
      offline_test: true # false = allow network during compile and test

  # Ship generated tests and docs to a repository after a STABLE run (CLI flag --ship). One block:
  # fill in the ACTIVE provider's values here, not a per-provider section.
  git:
    provider: github # github | gitlab | bitbucket | azure_devops
    token: "" # required for --ship; a PAT with repo scope
    # owner/repo are derived from the origin URL. Set them only to override — e.g. when the origin is
    # not a recognised URL for the provider. GitLab namespace/project, Bitbucket workspace/repo and
    # Azure organization/repository all map onto this pair.
    default_owner: "" # e.g. my-org
    default_repo: "" # e.g. my-service
    ship:
      branch: "asqs-core" # branch to push (created or updated on each --ship run)
      base_branch: "main" # PR base branch

  audit:
    file_path: "" # append one JSON object per step; empty = stderr lines only

# Detect and install a test framework when the repository has none. OFF by default: it modifies
# build files and runs installs.
bootstrap:
  test_framework:
    enabled: false
    mode: auto # auto | jest | junit | xunit | off
    pin_versions: false # exact versions, for reproducibility
    allow_lockfile_change: false # false = frozen lockfile (npm ci / --frozen-lockfile)
  e2e_framework:
    enabled: false # set up the E2E stack when --max-gaps-e2e > 0 and none exists
    mode: auto # auto | playwright | cypress | off
    execution: auto # auto | docker | local

indexer:
  execution: local # local | docker (docker = no host JDK/Node/.NET needed)
  java:
    # auto = the JavaParser JAR when jar_path resolves, line-based heuristics otherwise. Setting the
    # path is enough; v1 also needed a separate `type: advanced` and silently fell back without it.
    mode: auto # auto | advanced | minimal
    jar_path: "tools/java-indexer/target/java-indexer-0.1.0.jar"
  jsts:
    indexer_path: "tools/js-ts-indexer/dist/index.js"
  csharp:
    indexer_dll_path: "tools/csharp-indexer/publish/CSharpIndexer.dll"
  policy:
    # The --max-gaps / --max-gaps-e2e flags override these; the built-ins (10 unit, 0 E2E) apply only
    # when both the flag and the key are absent.
    max_gaps: 20
    max_gaps_e2e: 5 # 0 = skip E2E entirely

retrieval:
  profile: "" # java_unit | http_api | react_feature | nest_module | full_stack; empty = detect

generation:
  policy:
    tools:
      # Let the generator query the index while writing, instead of working only from the context
      # assembled up front. Needs a provider with tool calling; on Ollama it also needs
      # general.llm.ollama_num_ctx.
      enabled: false

fixer:
  iterations:
    # Budget for the SINGLE whole-project compile+test evaluation over ALL generated tests, not per
    # gap. Raise it for large batches. Tests still failing after this budget are discarded so the
    # rest of the project stays green.
    start: 10
